{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRN Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="flex justify-center items-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
    <!-- Outer Card -->
    <div class="relative w-[600px] h-[400px] bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden group">
      <!-- Animated border glow -->
      <div class="absolute inset-0 bg-gradient-to-r from-indigo-500 to-purple-500 opacity-0 group-hover:opacity-20 blur-2xl transition duration-700"></div>

      <!-- Title -->
      <h1 class="text-3xl font-bold text-gray-700 mt-4 text-center tracking-wide">
        MRN
      </h1>

      <!-- Inner rounded box -->
      <div class="flex flex-col justify-center items-center mt-8">
        <div class="w-[500px] h-[260px] bg-white/60 backdrop-blur-md rounded-3xl border border-gray-300 shadow-inner flex flex-col justify-center items-center transition-transform duration-500 group-hover:scale-[1.02]">
          
          <form method="post" class="flex flex-col items-center">
            {% csrf_token %}
            <div class="flex items-center space-x-4">
              <label for="mrn" class="text-lg font-medium text-gray-700">
                MRN :
              </label>
              <input
                id="mrn"
                name="mrn"
                type="text"
                placeholder="Enter MRN"
                class="w-56 px-4 py-2 rounded-md border-2 border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-300 outline-none text-gray-700 transition-all duration-300 shadow-sm hover:shadow-md"
              />
            </div>
            <!-- Animated button -->
            <button type="submit" class="mt-6 px-6 py-2 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-semibold rounded-md shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 transition-transform duration-300">
              Submit
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
