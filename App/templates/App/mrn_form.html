<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MRN Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl p-8 border border-gray-700">
        <h2 class="text-2xl font-bold text-center mb-6">🔍 Search MRN</h2>

        <!-- Form -->
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="mrn" class="block text-sm font-medium mb-1">MRN Number</label>
                <input type="text" name="mrn" id="mrn" placeholder="Enter MRN"
                       class="w-full px-4 py-2 rounded-xl bg-gray-700 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label for="document" class="block text-sm font-medium mb-1">Upload Document</label>
                <input type="file" name="document" id="document"
                       class="w-full  px-4 py-2 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            
            <button type="submit"
                    class="w-full py-2 px-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-white font-semibold transition duration-200 ease-in-out transform hover:scale-105">
                Search & Upload
            </button>
        </form>

        <!-- Result -->
        <div class="mt-6">
            {% if legal_name %}
                <div class="p-4 bg-green-700 rounded-xl shadow-md text-center animate-fade-in">
                    <p class="text-lg font-semibold"> Name:</p>
                    <p class="text-xl font-bold">{{ legal_name }}</p>
                </div>
            {% elif legal_name is not None %}
                <div class="p-4 bg-red-700 rounded-xl shadow-md text-center animate-fade-in">
                    <p class="text-lg font-semibold">❌ No record found for this MRN</p>
                </div>
            {% endif %}

            {% if document_url %}
                <div class="mt-4 p-3 bg-blue-700 rounded-xl text-center">
                    <p class="font-semibold">Document uploaded successfully:</p>
                    <a href="{{ document_url }}" target="_blank" class="underline text-white">View Document</a>
                </div>
            {% endif %}
        </div>
    </div>

    <!-- Small animation -->
    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.6s ease-in-out;
        }
    </style>

</body>
</html>
